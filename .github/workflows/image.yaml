# Build the image and pin its digest in the deploy manifest.
#
# One image per commit: `sha-<7>` plus `main`. The cluster pulls from GHCR with
# the `ghcr-pull` imagePullSecret in the monoplayer namespace. Pushing the
# digest commit to deploy/manifests is what makes Argo deploy: the workflow is
# ignored for changes under deploy, so that commit cannot loop.
#
# The build itself only needs the workflow GITHUB_TOKEN (packages: write). The
# classic read:packages PAT is for the cluster, not for this job.

name: image

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
      - "docs/**"
      - "**/*.md"
      - "testdata/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve names
        id: names
        run: |
          echo "image=ghcr.io/$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/monoplayer" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          python3 - "$DIGEST" "$TAG" <<'PY'
          import pathlib
          import re
          import sys

          digest, tag = sys.argv[1], sys.argv[2]
          path = pathlib.Path("deploy/manifests/kustomization.yaml")
          text = path.read_text()
          text = re.sub(r"digest: sha256:[0-9a-f]{64}", f"digest: {digest}", text)
          path.write_text(text)
          print(f"pinned {tag} {digest}")
          PY
          git config user.name "monoplayer-bot"
          git config user.email "monoplayer-bot@users.noreply.github.com"
          git add deploy/manifests/kustomization.yaml
          if git diff --cached --quiet; then
            echo "digest unchanged"
          else
            git commit -m "chore(deploy): image $TAG [skip ci]"
            git push
          fi
