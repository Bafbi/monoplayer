# Build the image and publish the bot-owned deploy branch.
#
# One image per commit: `sha-<7>` plus `main`. The cluster pulls from GHCR with
# the `ghcr-pull` imagePullSecret in the monoplayer namespace.
#
# main is human history. This workflow rebuilds the `deploy` branch as
# main + exactly one digest commit, and force-pushes it; Argo CD tracks
# `deploy`. So a push to main produces no extra commit on main, and the digest
# that actually runs is still recorded in Git on a branch nobody edits.
#
# The build itself only needs the workflow GITHUB_TOKEN (packages: write). The
# classic read:packages PAT is for the cluster, not for this job.

name: image

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "testdata/**"
      # The transfer testbed runs from the repo, not inside the app image.
      - "src/testbed/**"
      - "deploy/testbed/**"
      - ".scratch/**"
      - "mise.toml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate comes from ci.yaml so a red main never builds.
  check:
    uses: ./.github/workflows/ci.yaml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve names
        id: names
        run: |
          echo "image=ghcr.io/$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/monoplayer" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the deploy branch
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          python3 - "$DIGEST" "$TAG" <<'PY'
          import pathlib
          import re
          import sys

          digest, tag = sys.argv[1], sys.argv[2]
          path = pathlib.Path("deploy/manifests/kustomization.yaml")
          text = path.read_text()
          # main has no images block; the branch is rebuilt from main, but drop
          # any previous pin defensively before appending the new one.
          text = re.sub(r"\nimages:\n(?:[ \t]+.*\n?)+", "", text)
          text = text.rstrip("\n") + "\n\nimages:\n  - name: ghcr.io/bafbi/monoplayer\n    digest: " + digest + "\n"
          path.write_text(text)
          print(f"pinned {tag} {digest}")
          PY
          git config user.name "monoplayer-bot"
          git config user.email "monoplayer-bot@users.noreply.github.com"
          # deploy is bot-owned: always main plus at most one digest commit.
          # Its message mirrors the main commit it patches.
          SUBJECT=$(git log -1 --pretty=%s)
          git checkout -B deploy
          git add deploy/manifests/kustomization.yaml
          if git diff --cached --quiet; then
            echo "digest unchanged; deploy matches main"
          else
            git commit -m "${SUBJECT:-deploy} (patched)"
          fi
          git push --force origin deploy
