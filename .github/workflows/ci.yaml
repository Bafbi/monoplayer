# Default gate from mise.toml: `mise run check`.
#
# Runs on every push except `deploy`, and on every pull request. image.yaml
# calls this file as a reusable workflow, so a red main never builds.

name: ci

on:
  push:
    # The deploy branch is bot-written from an already-green main.
    branches-ignore: [deploy]
  pull_request:
  # image.yaml calls this file as a reusable workflow.
  workflow_call:

permissions:
  contents: read

# image.yaml calls this file, and a called workflow reads the caller's name from
# github.workflow. The literal `check` between the name and the ref keeps this
# group distinct from the caller's own group and from a direct ci run on the same
# ref, so neither cancels the other.
concurrency:
  group: ${{ github.workflow }}-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # java 25 and gradle 9.8 build the Gate B driver only, and mise run check
      # never calls them.
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm

      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: mise run check
