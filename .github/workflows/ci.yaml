# Default gate from mise.toml: `mise run check`.
#
# image.yaml calls this file and needs its `check` job, so a red main never
# publishes an image.

name: ci

on:
  push:
    # Only the default branch. A feature branch is checked by its pull request,
    # and running the same commit twice doubled the exposure to the loopback
    # rung's intermittent failure (#211): at roughly one run in three, a branch
    # showed a red `check` on about half its commits while its pull-request run
    # was green on the same tree, and GitHub blocks the merge on the red one.
    #
    # The deploy branch is bot-written from an already-green main, so it needs no
    # run of its own either. A branch with no pull request now goes unchecked
    # until one is opened, which is the price of the halved flake surface.
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A called workflow reads the caller's name from github.workflow, so the `check`
# segment keeps this group distinct from the caller's own group and from a direct
# ci run on the same ref.
concurrency:
  group: ${{ github.workflow }}-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung loopback must not hold a required check for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # java 25.0.2, gradle 9.8.2 and buildkit serve the client driver and the image.
      # `mise run check` touches none of them, so install node and pnpm only.
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm

      - name: Resolve the pnpm store path
        id: pnpm-store
        run: |
          path=$(pnpm store path --silent)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # Without --skip-tools, mise installs every tool in mise.toml here: java,
      # gradle and buildkit, because task.run_auto_install defaults to true.
      - run: mise run --skip-tools check
