# Default gate from mise.toml: `mise run check`.
#
# image.yaml calls this file as a reusable workflow and needs its `check` job, so
# a red main never publishes an image.

name: ci

on:
  push:
    # The deploy branch is bot-written from an already-green main.
    branches-ignore: [deploy]
  pull_request:
  # image.yaml calls this file as a reusable workflow.
  workflow_call:

permissions:
  contents: read

# image.yaml calls this file, and a called workflow reads the caller's name from
# github.workflow. The `check` segment keeps this group distinct from the caller's
# own group and from a direct ci run on the same ref.
concurrency:
  group: ${{ github.workflow }}-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung loopback must not hold a required check for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # java 25, gradle 9.8 and buildkit serve the Gate B driver and the image.
      # `mise run check` touches none of them, so install node and pnpm only.
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm

      - name: Resolve the pnpm store path
        id: pnpm-store
        run: |
          path=$(pnpm store path --silent)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # Without --skip-tools, mise installs every tool in mise.toml here: java,
      # gradle and buildkit, because task.run_auto_install defaults to true.
      - run: mise run --skip-tools check
