plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

version = '0.1.0'
group = 'eu.monoplayer'

base {
    archivesName = 'monoplayer-driver'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}


