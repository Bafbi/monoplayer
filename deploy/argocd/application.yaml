# The one Argo CD Application for Monoplayer.
#
# Applied by the operator once:
#   kubectl apply -f deploy/argocd/project.yaml -f deploy/argocd/application.yaml
#
# After that, every push to main reaches the cluster through Argo: the image
# workflow rebuilds the bot-owned `deploy` branch as main + one digest commit,
# and this Application tracks `deploy`. main stays human history. The
# repository credential is the `monoplayer-repo` Secret in the argocd
# namespace; see docs/deployment.md.
#
# This is the only Application. Its source is deploy/kustomization.yaml, which
# includes the proxy (deploy/manifests) and its ops panel (deploy/panel), so one
# merge deploys both and the operator applies one command. The panel does not get
# an Application of its own: a second one would mean two deploys, two rollbacks
# and two places a tree can drift.
#
# The dev and gate lanes are not here on purpose. docs/deployment.md records it:
# a branch image and a sleeping gate both depend on a human applying the tree,
# and this Application's selfHeal would undo each of them.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monoplayer
  namespace: argocd
  finalizers:
    # Deleting this Application deletes what it owns, except the objects
    # annotated Delete=false: the namespace itself and the custody PVC. The
    # control ConfigMap survives because Argo never created it.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monoplayer
  source:
    repoURL: https://github.com/Bafbi/monoplayer.git
    targetRevision: deploy
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: monoplayer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
