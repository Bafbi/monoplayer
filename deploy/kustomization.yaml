# The one GitOps tree: the live puppet and its panel, synced by one Argo CD
# Application, so a merge to main deploys both and nothing else.
#
# deploy/manifests and deploy/panel each keep a kustomization of their own,
# because each owns one half of the deploy: the proxy, and its panel. Both create
# objects in the one `monoplayer` namespace, and only deploy/manifests creates it.
#
# The image workflow appends `images:` to each child kustomization on the
# bot-owned `deploy` branch (#234). A child's image pin applies to that child's
# resources, so the proxy and the panel are pinned by digest in the same commit
# and neither can be a build behind the other.
#
# The dev and gate lanes are deliberately not here. docs/deployment.md says why:
# a branch image and a sleeping gate both depend on a human applying the tree,
# and selfHeal would undo each of them within minutes.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifests
  - panel
