# The dev Monoplayer (#42): one replica, its own custody volume, its own account.
#
# The live custody volume holds one writer and one replica, and a test pod must
# never mount it. This deployment owns `monoplayer-dev-custody` instead, and
# the account in it is the dev account (#44), never GlowSquidye. That account is
# bootstrapped once by `mise run dev:custody`; the image carries no tokens.
#
# The image is `:main` in the manifest so `kubectl kustomize` works with no
# extra step. The lane under test sets it to the branch image (#43):
#   kubectl -n monoplayer-dev set image deploy/monoplayer \
#     monoplayer=$(node scripts/dev-lane.sh image <sha7>)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monoplayer
  namespace: monoplayer-dev
  labels:
    app.kubernetes.io/name: monoplayer
    app.kubernetes.io/part-of: monoplayer
spec:
  # One writer: the account token chain is a rolling file, so two pods must
  # never run. Recreate plus ReadWriteOnce enforces it.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: monoplayer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monoplayer
        app.kubernetes.io/part-of: monoplayer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The dev account's tokens are in neither this repository nor the image:
        # #44 bootstraps them onto the claim once, and until then the app would
        # exit 2 and CrashLoop. Wait for them instead. The UUID is not pinned
        # because the account is a new identity; the alias is the contract.
        - name: wait-custody
          image: ghcr.io/bafbi/monoplayer:main
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until ls /data/accounts/*/profile.json >/dev/null 2>&1; do echo waiting-for-dev-custody; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: custody
              mountPath: /data
        # A crashed pod can leave writer.lock behind with a pid that now exists,
        # so the lock would look held forever. One replica plus Recreate makes
        # this pod the only writer of the dev account.
        - name: clear-stale-lock
          image: ghcr.io/bafbi/monoplayer:main
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - rm -f /data/accounts/*/writer.lock
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: custody
              mountPath: /data
      containers:
        - name: monoplayer
          image: ghcr.io/bafbi/monoplayer:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: MONOPLAYER_VERSION
              value: "26.2"
            - name: MONOPLAYER_BACKEND_HOST
              value: paper.monoplayer-dev.svc.cluster.local
            - name: MONOPLAYER_BACKEND_PORT
              value: "25565"
            - name: MONOPLAYER_FRONT_HOST
              value: 0.0.0.0
            - name: MONOPLAYER_FRONT_PORT
              value: "25565"
            - name: MONOPLAYER_PUPPET_ACCOUNTS_DIR
              value: /data/accounts
            # The dev account's alias, which `mise run dev:custody` sets at
            # bootstrap. Never GlowSquidye: borrowing the live account would
            # rebuild the one-writer problem the lane exists to avoid. There is no
            # MONOPLAYER_PUPPET_UUID or _USERNAME assertion here on purpose: the
            # account is bootstrapped after this manifest is written, so the alias
            # is the only identity the manifest can name.
            - name: MONOPLAYER_PUPPET_ACCOUNT
              value: devpuppet
            - name: MONOPLAYER_ATTACH_WHITELIST
              value: /config/attach-whitelist.json
            # This lane serves a picker (#392), and since #579 the live lane does
            # too. A joining client lands in the picker instead of attaching as the
            # body's driver, and can claim a row or watch one.
            # Off by default (src/service/monoplayer.js), so this line is the
            # whole difference between a lane a client can claim on and one it
            # cannot.
            - name: MONOPLAYER_PICKER
              value: "1"
            # The rows the picker offers, from the copy Git commits. This lane
            # names no live key, so the seed is the list (#356): the dev Paper,
            # at the address MONOPLAYER_BACKEND_HOST names.
            - name: MONOPLAYER_ALLOWED_SERVERS_SEED
              value: /config/allowed-servers.json
            - name: MONOPLAYER_CHAT
              value: read-only
            - name: HOME
              value: /tmp
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: custody
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: custody
          persistentVolumeClaim:
            claimName: monoplayer-dev-custody
        - name: config
          configMap:
            name: monoplayer-dev-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monoplayer-dev-config
  namespace: monoplayer-dev
  labels:
    app.kubernetes.io/part-of: monoplayer
data:
  # Who may control the dev proxy. An empty list denies every login: `--start` logs
  # `whitelistEmpty` and serves nobody until a controller is added
  # (src/service/start-live.js).
  #
  # Every entry has to be a UUID a Mojang session answers for: the front verifies each
  # login against Mojang before it shows a picker (src/legs/live-front.js), and the core's
  # `reviewLoginStart` (src/core/identity.js) then reviews the whitelist. `uuidRefusalReason`
  # (src/custody/util.js) is the shape rule an entry is held to.
  #
  # `mise run dev:up` is the only command in the tree that writes this key, and it judges
  # every list it writes with `tools/whitelist.mjs`: it leaves out an entry no login can
  # use (a name-derived UUID is the loopback rig's) and names each one it dropped. The
  # order it decides the list in is "The attach whitelist" in `deploy/dev/README.md` (#677).
  # Every apply writes this document, so an edit here reaches the lane on the next
  # `mise run dev:up`. It is not a secret. `mise run dev:down` deletes this ConfigMap,
  # and the list with it.
  attach-whitelist.json: |
    {
      "version": 1,
      "players": []
    }
  # The row the picker offers (#392). One server, this lane's own Paper, at the
  # name the proxy already dials. The file is the seed, not a live document: the
  # lane names no MONOPLAYER_ALLOWED_SERVERS, so nothing rewrites it and an edit
  # here reaches the lane on the next `mise run dev:up`.
  #
  # No addedAt stamp: a seed entry has none, and a rewrite must not invent one
  # (src/service/control.js).
  allowed-servers.json: |
    {
      "version": 1,
      "servers": [
        {
          "host": "paper.monoplayer-dev.svc.cluster.local",
          "port": 25565
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: monoplayer
  namespace: monoplayer-dev
  labels:
    app.kubernetes.io/name: monoplayer
    app.kubernetes.io/part-of: monoplayer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: monoplayer
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
---
# The front on the tailnet (#392), so a client on another machine joins by name
# instead of a port-forward:
#   monoplayer-dev.tail41e568.ts.net:25565
#
# A second Service, not this file's first one converted: spec.loadBalancerClass
# cannot be set on an existing Service, so converting would fail `kubectl apply`
# on a lane that is up. deploy/driver/paper.yaml keeps its ClusterIP Service
# beside a tailnet one for the same reason.
#
# The Paper has no Service here on purpose. A published Paper accepts a join that
# never reached a picker, and the point of this lane is the picker.
apiVersion: v1
kind: Service
metadata:
  name: monoplayer-dev
  namespace: monoplayer-dev
  labels:
    app.kubernetes.io/name: monoplayer
    app.kubernetes.io/part-of: monoplayer
  annotations:
    tailscale.com/hostname: monoplayer-dev
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: monoplayer
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
