# The dev Paper server. Disposable: emptyDir, no world persistence.
#
# Offline, for the lane #391 builds (#392). The front is this Paper's only client:
# it replays the puppet's session to the attaching player, so the mode here
# decides nothing about who may join the lane, and the front still verifies that
# player against Mojang and the attach whitelist before a picker or a claim.
# What the mode is for is the offline legs the composition root does not have
# yet: a lane that exists to be joined by bots cannot run a Paper that refuses a
# login Mojang never verified.
#
# Offline mode means the name is the identity, so a pod that can reach this
# Service could join as any name it likes, and the tree carries no NetworkPolicy.
# What keeps that a dev lane's problem is scope: this Paper has no tailnet
# Service and no published port, its world is one flat disposable map, it holds
# a second account and not GlowSquidye, and nothing sits behind it. The live
# lane is the opposite case: it fronts Excalia for real players, and nothing in
# this repository turns its online mode off.
#
# ENFORCE_SECURE_PROFILE is off for the same reason: a bot has no profile keys to
# sign a chat line with, and this server has nothing worth signing.
#
# The whitelist is off and empty in the manifest, because offline mode means the
# name is the identity and a whitelist would commit an account name to a manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper
  namespace: monoplayer-dev
  labels:
    app.kubernetes.io/name: paper
    app.kubernetes.io/part-of: monoplayer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paper
        app.kubernetes.io/part-of: monoplayer
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: paper
          image: itzg/minecraft-server:2026.10.1-java25
          imagePullPolicy: IfNotPresent
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: PAPER
            - name: VERSION
              value: "26.2"
            - name: PAPER_BUILD
              value: "135"
            - name: MEMORY
              value: 1536M
            - name: ONLINE_MODE
              value: "FALSE"
            - name: ENFORCE_SECURE_PROFILE
              value: "FALSE"
            # Off on purpose. This server is reachable only inside the cluster,
            # and a whitelist here would mean committing an account name to a
            # manifest. It is disposable, so a second gate buys nothing.
            - name: ENFORCE_WHITELIST
              value: "FALSE"
            - name: LEVEL_TYPE
              value: "minecraft:flat"
            - name: GENERATE_STRUCTURES
              value: "false"
            - name: LEVEL_SEED
              value: "dev"
            - name: VIEW_DISTANCE
              value: "6"
            - name: SIMULATION_DISTANCE
              value: "6"
            - name: SPAWN_PROTECTION
              value: "0"
            - name: DIFFICULTY
              value: peaceful
            - name: MODE
              value: survival
            - name: MAX_PLAYERS
              value: "8"
            - name: ENABLE_RCON
              value: "TRUE"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dev-rcon
                  key: password
            - name: MOTD
              value: monoplayer dev
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 5
            failureThreshold: 120
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: paper
  namespace: monoplayer-dev
  labels:
    app.kubernetes.io/name: paper
    app.kubernetes.io/part-of: monoplayer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paper
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
