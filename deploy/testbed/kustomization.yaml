# The controlled transfer testbed.
#
# Two Paper 26.2 servers, both online-mode, with RCON. `paper-hub` is the
# Monoplayer backend; `paper-sky` only accepts transferred clients
# (accepts-transfers=true). The transfer is triggered from the hub console,
# so the switch is deterministic and does not depend on a server menu.
#
# The testbed Monoplayer runs in the `monoplayer` namespace on the same
# custody PVC as the live deployment, so the GlowSquidye token chain stays
# single-writer. The orchestrator scales the live deployment to zero first.
#
# This tree is not managed by Argo. `src/testbed/switch.js` applies it, and its
# `run` command does the transfer and restores the live deployment from a
# `finally`. An interrupt skips that block, so it needs
# `mise run testbed:down`.
#
# `namespace.yaml` is here because the Papers' namespace is the one gate
# namespace no worktree derives, and `scripts/gate-lane.sh` finds a lane by a
# label on it (#318). The object is also what lets this tree apply to a cluster
# that never ran the old driver tree at all.
#
# The Secret both Papers read is not here, and must not be: `src/testbed/switch.js`
# applies this namespace, then makes `gate-b-rcon` with a random value when it is
# absent, then applies this tree (#362). A committed Secret is a credential in git,
# and a cluster with none is what left both Papers in CreateContainerConfigError.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - paper-hub.yaml
  - paper-sky.yaml
  - monoplayer-testbed.yaml
