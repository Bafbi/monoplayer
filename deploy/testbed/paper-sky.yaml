# Paper 26.2 target: the server the puppet is transferred to.
#
# accepts-transfers=true is the property the transfer handshake requires.
# The datapack overrides `minecraft:overworld` so the target's
# dimension_type registry differs from the hub's; the seamless switch must
# replace the client's registries, not just respawn it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: paper-sky-datapack
  namespace: monoplayer-gate-b
  labels:
    app.kubernetes.io/part-of: monoplayer-testbed
data:
  pack.mcmeta: |
    {
      "pack": {
        "pack_format": 107,
        "supported_formats": { "min_inclusive": 0, "max_inclusive": 999 },
        "description": "monoplayer testbed: different dimension_type registry"
      }
    }
  void.json: |
    {
      "ambient_light": 0.05,
      "attributes": {
        "minecraft:audio/ambient_sounds": {
          "mood": {
            "block_search_extent": 8,
            "offset": 2.0,
            "sound": "minecraft:ambient.cave",
            "tick_delay": 6000
          }
        },
        "minecraft:audio/background_music": {
          "creative": {
            "max_delay": 24000,
            "min_delay": 12000,
            "sound": "minecraft:music.creative"
          },
          "default": {
            "max_delay": 24000,
            "min_delay": 12000,
            "sound": "minecraft:music.game"
          }
        },
        "minecraft:gameplay/bed_rule": {
          "can_set_spawn": "always",
          "can_sleep": "when_dark",
          "error_message": {
            "translate": "block.minecraft.bed.no_sleep"
          }
        },
        "minecraft:gameplay/nether_portal_spawns_piglin": true,
        "minecraft:gameplay/respawn_anchor_works": false,
        "minecraft:visual/ambient_light_color": "#0a0a0a",
        "minecraft:visual/cloud_color": "#ccffffff",
        "minecraft:visual/cloud_height": 192.33,
        "minecraft:visual/fog_color": "#c0d8ff",
        "minecraft:visual/sky_color": "#78a7ff"
      },
      "coordinate_scale": 1.0,
      "default_clock": "minecraft:overworld",
      "has_ceiling": false,
      "has_ender_dragon_fight": false,
      "has_skylight": true,
      "height": 384,
      "infiniburn": "#minecraft:infiniburn_overworld",
      "logical_height": 384,
      "min_y": -64,
      "monster_spawn_block_light_limit": 0,
      "monster_spawn_light_level": {
        "type": "minecraft:uniform",
        "max_inclusive": 7,
        "min_inclusive": 0
      },
      "timelines": "#minecraft:in_overworld"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper-sky
  namespace: monoplayer-gate-b
  labels:
    app.kubernetes.io/name: paper-sky
    app.kubernetes.io/part-of: monoplayer-testbed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paper-sky
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paper-sky
        app.kubernetes.io/part-of: monoplayer-testbed
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Paper rejects symlinks inside the world, and ConfigMap volumes are
        # symlink farms. Copy the pack into real files in the emptyDir first.
        - name: datapack
          image: itzg/minecraft-server:2026.10.1-java25
          command:
            - sh
            - -c
            - >-
              mkdir -p /data/world/datapacks/testbed &&
              cp -rL /src/. /data/world/datapacks/testbed/ &&
              chown -R 1000:1000 /data/world
          volumeMounts:
            - name: data
              mountPath: /data
            - name: datapack
              mountPath: /src
              readOnly: true
      containers:
        - name: paper
          image: itzg/minecraft-server:2026.10.1-java25
          imagePullPolicy: IfNotPresent
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: PAPER
            - name: VERSION
              value: "26.2"
            - name: PAPER_BUILD
              value: "135"
            - name: MEMORY
              value: 1536M
            - name: ONLINE_MODE
              value: "TRUE"
            - name: ENFORCE_SECURE_PROFILE
              value: "TRUE"
            - name: ENFORCE_WHITELIST
              value: "FALSE"
            - name: LEVEL_TYPE
              value: "minecraft:flat"
            - name: GENERATE_STRUCTURES
              value: "false"
            - name: LEVEL_SEED
              value: "803"
            - name: VIEW_DISTANCE
              value: "4"
            - name: SIMULATION_DISTANCE
              value: "4"
            - name: SPAWN_PROTECTION
              value: "0"
            - name: DIFFICULTY
              value: peaceful
            - name: MODE
              value: creative
            - name: MAX_PLAYERS
              value: "4"
            - name: ACCEPTS_TRANSFERS
              value: "TRUE"
            - name: ENABLE_RCON
              value: "TRUE"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gate-b-rcon
                  key: password
            - name: MOTD
              value: monoplayer testbed sky
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
        - name: datapack
          configMap:
            name: paper-sky-datapack
            items:
              - key: pack.mcmeta
                path: pack.mcmeta
              - key: void.json
                path: data/testbed/dimension_type/void.json
---
apiVersion: v1
kind: Service
metadata:
  name: paper-sky
  namespace: monoplayer-gate-b
  labels:
    app.kubernetes.io/name: paper-sky
    app.kubernetes.io/part-of: monoplayer-testbed
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paper-sky
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
