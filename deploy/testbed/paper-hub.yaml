# Paper 26.2 hub: the Monoplayer testbed backend.
#
# It has no world persistence (emptyDir): the testbed is disposable. Flat
# world, creative, peaceful: the switch test only needs a valid join and a
# deterministic spawn.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper-hub
  namespace: monoplayer-gate-b
  labels:
    app.kubernetes.io/name: paper-hub
    app.kubernetes.io/part-of: monoplayer-testbed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paper-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paper-hub
        app.kubernetes.io/part-of: monoplayer-testbed
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: paper
          image: itzg/minecraft-server:2026.10.1-java25
          imagePullPolicy: IfNotPresent
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: PAPER
            - name: VERSION
              value: "26.2"
            - name: PAPER_BUILD
              value: "135"
            - name: MEMORY
              value: 1536M
            - name: ONLINE_MODE
              value: "TRUE"
            - name: ENFORCE_SECURE_PROFILE
              value: "TRUE"
            - name: ENFORCE_WHITELIST
              value: "FALSE"
            - name: LEVEL_TYPE
              value: "minecraft:flat"
            - name: GENERATE_STRUCTURES
              value: "false"
            - name: LEVEL_SEED
              value: "802"
            - name: VIEW_DISTANCE
              value: "4"
            - name: SIMULATION_DISTANCE
              value: "4"
            - name: SPAWN_PROTECTION
              value: "0"
            - name: DIFFICULTY
              value: peaceful
            - name: MODE
              value: creative
            - name: MAX_PLAYERS
              value: "4"
            - name: ACCEPTS_TRANSFERS
              value: "FALSE"
            - name: ENABLE_RCON
              value: "TRUE"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gate-b-rcon
                  key: password
            - name: MOTD
              value: monoplayer testbed hub
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: paper-hub
  namespace: monoplayer-gate-b
  labels:
    app.kubernetes.io/name: paper-hub
    app.kubernetes.io/part-of: monoplayer-testbed
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paper-hub
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
