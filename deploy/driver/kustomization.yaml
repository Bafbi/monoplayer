# The gate lane, and a template for one. This tree names the lane
# monoplayer-gate-b wherever the lane is named, so a second instance is one
# substitution: scripts/gate-lane.sh render writes the copy a lane applies, and
# deploy/driver/README.md says why. Instance b is today's lane, and the copy is
# then this directory byte for byte.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - paper.yaml
  - paper-conduct.yaml
  - velocity.yaml
  - paper-m4.yaml
  - toxiproxy.yaml
