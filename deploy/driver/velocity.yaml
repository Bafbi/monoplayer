# Velocity 4.3.1 build 45 — the M4/M5 proxy lane.
#
#  Client -> Velocity (online-mode=true, modern forwarding, secret from a
#  Kubernetes Secret) -> Paper 26.1.2 backend (paper-m4.yaml, offline mode).
#
# Velocity 4.3.1 needs Java 25; itzg/mc-proxy:java25 provides it. The jar is
# downloaded at pod start from the PaperMC fill API as
#   velocity-4.3.1-45.jar (sha256 0844bcabdcdb4f5b875906fd4c3365bc1bb76918e42bc595ed88ad195258dd75)
# pinned by VELOCITY_VERSION + VELOCITY_BUILD_ID below. See
# docs/paper-behind-velocity.md ("Digest pinning") for turning the tag pins into
# digest pins before any longer-lived lane.
#
# The forwarding secret is never a manifest or ConfigMap value: pods read it
# from the `gate-__instance__-velocity` Secret, which `gate:up` creates when it is absent
# (README, "One tree, one lane, one value").
apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-__instance__-velocity-config
  namespace: monoplayer-gate-__instance__
  labels:
    app.kubernetes.io/name: monoplayer-gate-__instance__-velocity
    app.kubernetes.io/part-of: monoplayer
data:
  # Velocity 4.3.1 default template (config-version 2.9, from PaperMC/Velocity
  # tag v4.3.1) with the M4 pins applied. itzg/mc-proxy syncs /config into
  # /server at startup; SYNC_SKIP_NEWER_IN_DESTINATION=false keeps it
  # deterministic across restarts.
  velocity.toml: |
    # Config version. Do not change this
    config-version = "2.9"

    # the M4 pin: the proxy binds 25566 so the 25565-style client/port
    # numbers stay reserved for backends and Tailscale surfaces.
    bind = "0.0.0.0:25566"

    motd = "<#09add3>Monoplayer Gate B - Velocity 4.3.1 b45 M4"
    show-max-players = 4

    # The proxy authenticates players with Mojang (proxy online).
    online-mode = true

    # Enforce the chat/signing public-key standard (plan: force-key-authentication=true).
    force-key-authentication = true

    prevent-client-proxy-connections = false

    # Modern forwarding is the M4 pass path (plan M4).
    player-info-forwarding-mode = "modern"

    # Secret mounted from the gate-__instance__-velocity Kubernetes Secret; absolute path
    # so the image's auto-generated /server/forwarding.secret fallback is never read.
    forwarding-secret-file = "/run/secrets/gate-__instance__-velocity/forwarding-secret"

    announce-forge = false
    kick-existing-players = false
    sample-players-in-ping = false
    enable-player-address-logging = true

    [ping-passthrough]
    version = false
    players = false
    description = false
    favicon = false
    modinfo = false

    [packet-limiter]
    interval = 7
    packets-per-second = -1
    bytes-per-second = -1
    decompressed-bytes-per-second = 5242880

    [servers]
    # The M4 backend: Paper 26.1.2 b74 offline behind Velocity (paper-m4.yaml).
    lobby = "paper-m4:25565"

    try = [
        "lobby"
    ]

    # No forced hosts on purpose: host-based routing must never reject the
    # Tailscale hostname used for the pre-Monoplayer smoke join.
    [forced-hosts]

    [advanced]
    # Plan pin: network-compression-threshold=256 on the whole lane.
    compression-threshold = 256
    compression-level = -1
    login-ratelimit = 3000
    connection-timeout = 5000
    read-timeout = 30000
    haproxy-protocol = false
    tcp-fast-open = false
    bungee-plugin-message-channel = true
    show-ping-requests = false
    failover-on-unexpected-server-disconnect = true
    announce-proxy-commands = true
    log-command-executions = false
    log-player-connections = true
    accepts-transfers = false
    enable-reuse-port = false
    command-rate-limit = 50
    forward-commands-if-rate-limited = true
    kick-after-rate-limited-commands = 0
    tab-complete-rate-limit = 10
    kick-after-rate-limited-tab-completes = 0

    [query]
    enabled = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity
  namespace: monoplayer-gate-__instance__
  labels:
    app.kubernetes.io/name: monoplayer-gate-__instance__-velocity
    app.kubernetes.io/part-of: monoplayer
spec:
  # 0 at rest: `mise run gate:up` wakes this, and `gate:down` puts it back (#115).
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: monoplayer-gate-__instance__-velocity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monoplayer-gate-__instance__-velocity
        app.kubernetes.io/part-of: monoplayer
    spec:
      containers:
        - name: velocity
          image: itzg/mc-proxy:java25
          imagePullPolicy: IfNotPresent
          env:
            - name: TYPE
              value: VELOCITY
            - name: VELOCITY_VERSION
              value: "4.3.1"
            - name: VELOCITY_BUILD_ID
              value: "45"
            - name: INIT_MEMORY
              value: 512M
            - name: MAX_MEMORY
              value: 768M
            # The image auto-detects the bind port for its health check; pin it
            # to the M4 bind so a missed config sync cannot strand readiness.
            - name: SERVER_PORT
              value: "25566"
            # Force our velocity.toml over anything the proxy rewrote at runtime.
            - name: SYNC_SKIP_NEWER_IN_DESTINATION
              value: "false"
          ports:
            - name: minecraft
              containerPort: 25566
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: server
              mountPath: /server
            - name: config
              mountPath: /config
              readOnly: true
            - name: forwarding-secret
              mountPath: /run/secrets/gate-__instance__-velocity
              readOnly: true
      volumes:
        - name: server
          emptyDir: {}
        - name: config
          configMap:
            name: gate-__instance__-velocity-config
            items:
              - key: velocity.toml
                path: velocity.toml
        - name: forwarding-secret
          secret:
            secretName: gate-__instance__-velocity
            items:
              - key: forwarding-secret
                path: forwarding-secret
---
apiVersion: v1
kind: Service
metadata:
  name: velocity
  namespace: monoplayer-gate-__instance__
  labels:
    app.kubernetes.io/name: monoplayer-gate-__instance__-velocity
    app.kubernetes.io/part-of: monoplayer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: monoplayer-gate-__instance__-velocity
  ports:
    - name: minecraft
      port: 25566
      targetPort: minecraft
---
# Pre-Monoplayer bring-up only: the official client joins Velocity through
# Tailscale for the M4 smoke. Delete this Service once Monoplayer fronts the
# proxy; the pass path is cluster-internal (toxiproxy -> velocity:25566) and
# must not depend on this Service.
apiVersion: v1
kind: Service
metadata:
  name: velocity-m4
  namespace: monoplayer-gate-__instance__
  labels:
    app.kubernetes.io/name: monoplayer-gate-__instance__-velocity
    app.kubernetes.io/part-of: monoplayer
  annotations:
    tailscale.com/hostname: monoplayer-gate-__instance__-velocity
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: monoplayer-gate-__instance__-velocity
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
