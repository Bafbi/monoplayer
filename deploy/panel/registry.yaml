# The registry: the puppets the panel may touch.
#
# It is a ConfigMap in Git, not a discovery step. The panel never lists pods to
# find work, so the list it can act on is the list a reviewer reads in the diff.
# Each entry names the one control ConfigMap the panel may write for that puppet,
# and the seed ConfigMap it may only read; role.yaml names the first in a write
# rule and the second in a `get`-only rule, and
# test/tooling/panel-manifests.test.js fails when the lists disagree in either
# direction.
#
# `seedConfigMap` is the copy Git commits (#262). One control key has a fallback:
# the lane offers the list this object holds whenever the live key is absent or
# unreadable, and the panel lists and edits from it when the live key is absent, so
# a first write is built on the committed list rather than on an empty document. A
# live key that exists and does not parse is refused by name instead, so the file
# that needs fixing is not hidden behind a list that looks normal.
#
# It is a read because it is Argo's: a write to it would be reverted by the next
# sync, which is the whole reason the control ConfigMap is not in Git.
#
# The two keys the panel writes here are the attach whitelist and the allowed-server
# list (#232, #262). #264 retired the third: the panel used to be able to point a
# puppet at another backend, and its registry field went with the route.
#
# The control ConfigMap itself is deliberately not here. RBAC cannot scope
# `create` by name, so the panel is given no create verb at all; the operator
# creates the object once per puppet (docs/panel.md carries the command). A
# Git-tracked copy would also be reverted to its committed content by Argo's
# selfHeal within minutes of the first panel write.
#
# The JSON is one block because the panel mounts this ConfigMap and reads the
# projected file: one key, one file, no YAML reader in the image.

apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-registry
  namespace: monoplayer-panel
  labels:
    app.kubernetes.io/name: panel
    app.kubernetes.io/part-of: monoplayer
data:
  puppets.json: |
    {
      "version": 1,
      "puppets": [
        {
          "name": "glowsquidye",
          "namespace": "monoplayer",
          "deployment": "monoplayer",
          "controlConfigMap": "monoplayer-control",
          "seedConfigMap": "monoplayer-config",
          "frontHostname": "glowsquidye.tail41e568.ts.net",
          "backend": "play2.excalia.fr:25565"
        }
      ]
    }
