# The registry: the puppets the panel may touch.
#
# It is a ConfigMap in Git, not a discovery step. The panel never lists pods to
# find work, so the list it can act on is the list a reviewer reads in the diff.
# Each entry names the one control ConfigMap the panel may write for that puppet;
# role.yaml names the same ConfigMap in `resourceNames`, and
# test/tooling/panel-manifests.test.js fails when the two lists disagree in either
# direction.
#
# `allowBackendSwitch` is whether this puppet may be pointed at another backend
# from the panel (#233). It is the panel's own declaration, not the fence: the
# puppet reads a desired backend only when its lane sets MONOPLAYER_CONTROL_FILE,
# and obeys it only when it also sets MONOPLAYER_CONTROL_ALLOW_BACKEND_SWITCH=1.
#
# **The two halves must agree, and a test now says so.** This flag answers "may the
# panel ask"; the lane's variables answer "will the puppet obey". True over a lane
# that says 0 is a button that writes a document the puppet refuses once and names;
# true over a lane with no control file is a button that writes into a file nothing
# opens, which is the failure that was live for an hour after the panel shipped.
# `test/tooling/live-manifests.test.js` reads both files and fails when they
# disagree, so flipping one without the other is a red gate rather than a silent
# no-op.
#
# True, because `deploy/manifests/deployment.yaml` mounts the control ConfigMap and
# sets all three variables. `docs/panel.md` records the order the two are meant to
# be turned on in.
#
# The control ConfigMap itself is deliberately not here. RBAC cannot scope
# `create` by name, so the panel is given no create verb at all; the operator
# creates the object once per puppet (docs/panel.md carries the command). A
# Git-tracked copy would also be reverted to its committed content by Argo's
# selfHeal within minutes of the first panel write.
#
# The JSON is one block because the panel mounts this ConfigMap and reads the
# projected file: one key, one file, no YAML reader in the image.

apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-registry
  namespace: monoplayer-panel
  labels:
    app.kubernetes.io/name: panel
    app.kubernetes.io/part-of: monoplayer
data:
  puppets.json: |
    {
      "version": 1,
      "puppets": [
        {
          "name": "glowsquidye",
          "namespace": "monoplayer",
          "deployment": "monoplayer",
          "controlConfigMap": "monoplayer-control",
          "frontHostname": "glowsquidye.tail41e568.ts.net",
          "backend": "play2.excalia.fr:25565",
          "allowBackendSwitch": true
        }
      ]
    }
