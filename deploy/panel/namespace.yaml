# The panel's own namespace.
#
# Not the puppet's: the panel writes there through the Role in role.yaml, and a
# panel that lived beside the puppet would mount the same pod spec surface as the
# thing it is supposed to be separated from. It holds one Deployment, one Service
# on the tailnet, and the registry ConfigMap the panel reads.
#
# Argo creates this namespace from this file, so deleting the Application takes it
# and everything in it. That is the rollback in docs/panel.md, and it costs
# nothing: the registry is in Git and the panel keeps no state.

apiVersion: v1
kind: Namespace
metadata:
  name: monoplayer-panel
  labels:
    app.kubernetes.io/part-of: monoplayer
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
