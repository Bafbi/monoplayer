# The panel's identity, and the only workload in this repository that needs one.
#
# The proxy and the tunnel agent both set automountServiceAccountToken: false,
# because neither speaks to the API server. The panel does, so it says so on the
# pod as well: a reader should not have to know the default to see where the token
# comes from. The Role in role.yaml is the whole of what it can do.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: panel
  namespace: monoplayer-panel
  labels:
    app.kubernetes.io/name: panel
    app.kubernetes.io/part-of: monoplayer
automountServiceAccountToken: true
