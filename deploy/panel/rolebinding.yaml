# The binding that gives the panel its Role, and nothing else.
#
# Subject and Role are both in `monoplayer`: RBAC grants on the namespace an object
# lives in, and the panel lives with the puppet it writes (#609). The subject names
# that namespace even though it is this binding's own, so a reader sees where the
# ServiceAccount is without working it out from the omission.
#
# roleRef is a Role and never a ClusterRole: this binding can only ever hand out the
# authority role.yaml states.

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: panel-control
  namespace: monoplayer
  labels:
    app.kubernetes.io/name: panel
    app.kubernetes.io/part-of: monoplayer
subjects:
  - kind: ServiceAccount
    name: panel
    namespace: monoplayer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: panel-control
