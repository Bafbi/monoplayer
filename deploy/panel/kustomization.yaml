# The panel's whole GitOps state.
#
# The Application in deploy/argocd syncs deploy/kustomization.yaml, which includes
# this directory beside the proxy: one deploy, one namespace. Every object here
# lands in `monoplayer`, and this tree creates no Namespace.
#
# It created one until #609, and that namespace bought a name and nothing else. The
# Role was always the proxy's. The binding's subject in a second namespace was the
# only thing the split added, and it cost a duplicate `ghcr-pull` Secret.
#
# role.yaml and rolebinding.yaml are in `monoplayer` because RBAC says so: a Role
# grants only on the namespace it lives in. The panel is in that namespace too, so
# the subject and the Role are one namespace's objects.
#
# The image is named with the moving `main` tag, and
# .github/workflows/image.yaml appends a digest pin here on the `deploy` branch, in
# the same commit it pins the proxy (#234). So this tree and the one beside it
# always run one build, and the kustomization on main carries no pin at all.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - registry.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - role.yaml
  - rolebinding.yaml

images:
  - name: ghcr.io/bafbi/monoplayer
    digest: sha256:16fded99d02dd2f491c6d005ab7a4a43bb1244aaf34c7d3b97eea8b9c4e39e82
