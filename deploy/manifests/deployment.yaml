# The Monoplayer puppet proxy.
#
# One replica. The backend login is a rolling refresh-token chain, so two pods
# must never run: the strategy is Recreate and the account PVC is
# ReadWriteOnce. A second writer would race the token rotation.
#
# Startup waits for the custody seed. The PVC is created empty by Argo; the
# operator copies the GlowSquidye account directory once, then the init
# container releases the app.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: monoplayer
  namespace: monoplayer
  labels:
    app.kubernetes.io/name: monoplayer
    app.kubernetes.io/part-of: monoplayer
spec:
  # Season 3 is reachable directly at play2.excalia.fr. The puppet joins it
  # with 26.2, so the limbo dialog is bypassed.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: monoplayer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monoplayer
        app.kubernetes.io/part-of: monoplayer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-custody
          image: ghcr.io/bafbi/monoplayer:main
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until [ -f /data/accounts/73e0e19b-d4e4-4cc1-a553-a3952f0c1aed/profile.json ]; do echo waiting-for-custody; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: custody
              mountPath: /data
        # A crashed pod can leave writer.lock with pid 1. In a new container
        # pid 1 always exists, so the pid lock would look held forever. One
        # replica plus Recreate makes this pod the only writer, so clear it.
        - name: clear-stale-lock
          image: ghcr.io/bafbi/monoplayer:main
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - rm -f /data/accounts/73e0e19b-d4e4-4cc1-a553-a3952f0c1aed/writer.lock
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: custody
              mountPath: /data
      containers:
        - name: monoplayer
          image: ghcr.io/bafbi/monoplayer:main
          imagePullPolicy: IfNotPresent
          env:
            - name: MONOPLAYER_BACKEND_HOST
              value: play2.excalia.fr
            - name: MONOPLAYER_BACKEND_PORT
              value: "25565"
            - name: MONOPLAYER_FRONT_HOST
              value: 0.0.0.0
            - name: MONOPLAYER_FRONT_PORT
              value: "25565"
            - name: MONOPLAYER_PUPPET_ACCOUNTS_DIR
              value: /data/accounts
            - name: MONOPLAYER_PUPPET_ACCOUNT
              value: glowsquidye
            - name: MONOPLAYER_PUPPET_UUID
              value: 73e0e19b-d4e4-4cc1-a553-a3952f0c1aed
            - name: MONOPLAYER_PUPPET_USERNAME
              value: GlowSquidye
            # #229/#232: the runtime control document, and the whitelist it
            # reloads. Both files live in `monoplayer-control`, an object the
            # panel patches and Git does not own, mounted at /control (#228).
            # Before this, the whitelist was the Git ConfigMap read once at boot,
            # so a write from the panel reached a file the puppet never re-read.
            - name: MONOPLAYER_ATTACH_WHITELIST
              value: /control/attach-whitelist.json
            - name: MONOPLAYER_CONTROL_FILE
              value: /control/desired.json
            # The panel may move this puppet's backend, and an attached player
            # keeps their connection through the move (#233). This is the one
            # switch that lets an operator action reach the live session with no
            # deploy; setting it to "0" turns the move into a named refusal.
            - name: MONOPLAYER_CONTROL_ALLOW_BACKEND_SWITCH
              value: "1"
            - name: MONOPLAYER_VERSION
              value: "26.2"
            # Commands-only chat (#97): the human's commands are spoken as the
            # puppet, signed with its own keys, and their chat text is still
            # dropped. /profil and every other permitted command work; the
            # account does not speak in open chat.
            - name: MONOPLAYER_CHAT
              value: commands
            # Configuration-phase gate only (#21). A play dialog is never
            # answered by the puppet: it waits for the human to attach and
            # answer it (#20).
            - name: MONOPLAYER_DIALOG_ACTION
              value: last
            # Telemetry goes to the cluster collector, which fans out logs,
            # metrics, and traces to OpenObserve. Both signals are inert when
            # the endpoint is empty.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.deepmine-shared.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: monoplayer
            # Exact packet journal, on its own emptyDir and never on the
            # custody PVC: a diagnostic artifact must not be able to starve the
            # account tokens (#96). Retention is what bounds it; the volume's
            # sizeLimit is the backstop that keeps a retention bug from filling
            # the node, at the price of an eviction. The budget and the limit are
            # a pair: the directory holds at most the budget plus one shard per
            # kind, 256 MiB + 3 x 64 MiB, and the limit sits above both. Frames do
            # not survive a restart, so the 48-hour horizon below means 48 hours
            # or since the last restart, whichever is shorter; the JSONL log and
            # OTLP are the durable record.
            #
            # One shard per hour and frame kind (#217), gzipped when its hour
            # turns. The entity stream is dropped and chunks are length-only, so
            # an hour is about two megabytes and 48 hours fits the budget.
            - name: MONOPLAYER_JOURNAL_DIR
              value: /tmp/journal
            - name: MONOPLAYER_JOURNAL_MAX_BYTES
              value: "67108864"
            - name: MONOPLAYER_JOURNAL_MAX_TOTAL_BYTES
              value: "268435456"
            - name: MONOPLAYER_JOURNAL_MAX_AGE_MS
              value: "172800000"
            - name: HOME
              value: /tmp
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: custody
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            # Read-only, and the only writable leg is the panel patching the
            # object through the API server. A puppet that could write its own
            # control document would be a puppet that can move itself.
            - name: control
              mountPath: /control
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: journal
              mountPath: /tmp/journal
      volumes:
        - name: custody
          persistentVolumeClaim:
            claimName: monoplayer-custody
        - name: config
          configMap:
            name: monoplayer-config
        # The runtime control document (#229, #232). Not in Git, and never in Git:
        # Argo's selfHeal would revert every panel write within minutes. The
        # operator creates it once, from the whitelist this repository ships:
        #   kubectl create configmap monoplayer-control -n monoplayer \
        #     --from-file=attach-whitelist.json
        # `optional: true` is load-bearing. Without it a missing object keeps the
        # puppet from starting, which would make the panel's own documentation a
        # prerequisite for the lane coming up.
        - name: control
          configMap:
            name: monoplayer-control
            optional: true
        # HOME is /tmp, where the auth libraries write, so the journal gets its
        # own volume: a full journal must not take that write path down with it.
        # At the measured 4.07 MB/min the budget keeps about an hour of frames.
        - name: tmp
          emptyDir: {}
        - name: journal
          emptyDir:
            sizeLimit: 512Mi
