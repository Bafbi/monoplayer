# Monoplayer: the single puppet proxy for play2.excalia.fr.
#
# This directory is the app's whole GitOps state. The Argo CD Application in
# ../argocd syncs it into the `monoplayer` namespace. The image comes from
# GHCR and is pinned by digest; .github/workflows/image.yaml builds it on
# every push to main and writes the new digest back here.
#
# playit-agent.yaml is the public tunnel (#202). It is the only object here
# whose secret lives outside Git; docs/public-access.md is its runbook, and
# its removal returns the lane to tailnet-only.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - playit-agent.yaml
  # The account lease's grant (#302). The Lease itself is not here: one run holds it and
  # it is empty between runs, so a sync would fight a run for the object.
  - account-lease-role.yaml
  - account-lease-rolebinding.yaml

# main references the moving `main` tag. The image workflow rebuilds the
# `deploy` branch from main and appends an `images:` digest pin there, so this
# file on main never carries a stale digest.
