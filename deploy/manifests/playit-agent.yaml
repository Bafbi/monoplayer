# The public route: a playit.gg tunnel agent (#202).
#
# The tailnet is the front's default route (see service.yaml). This Deployment
# is the second: it carries a raw TCP port from playit.gg's edge to the front,
# so a guest on no tailnet joins by the name playit gives out.
#
# What it decides: nothing. The gate stays authentication plus the attach
# whitelist, on the puppet's own connection to the backend. A stranger who
# reaches the front through this tunnel is treated exactly like a stranger on
# the tailnet, down to the refusal text.
#
# What bounds it: `preAuth.maxConnections` (#201), on by default at 16, is a
# total rather than a per-source count, so it holds when the tunnel presents
# its own address instead of the client's. That cap landed before this file
# existed, and the record of the order is docs/public-access.md.
#
# The tunnel's local target is the front's in-namespace DNS name, set in the
# playit dashboard (tunnel field `local_ip`, "IP or hostname"): the docker
# example's `--net=host` has no Kubernetes equivalent, and every pod has its
# own network namespace, so `127.0.0.1` inside this pod is this pod.
#
# The secret is the cluster Secret `playit-agent`, key `SECRET_KEY`, like
# `ghcr-pull`: created by the operator, never in Git, and outside Argo's
# authorship so Argo does not prune it. docs/public-access.md covers the
# two-credential trap that secret hides behind.
#
# Image: pinned by digest. The image line below pins the index digest, which is
# what `crane digest ghcr.io/playit-cloud/playit-agent:1.0` prints; the linux/amd64
# manifest under it is
# sha256:33a05b36b16c2b036ab4fef951d9a7c029e91509257fb0e9fbcea2566d7883c0.
# The tag is not referenced, so a re-tag upstream cannot move this pod.
#
# There is no probe. playitd exposes no health endpoint, the image carries no
# CLI to ask one, and its only readiness signal is a stdout line. A probe that
# greps that line would restart a healthy agent whenever playit changed a word,
# so the pod relies on the container exiting when playitd dies, and a stale
# tunnel reads as a Ready pod. docs/public-access.md says what to read instead.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: playit-agent
  namespace: monoplayer
  labels:
    app.kubernetes.io/name: playit-agent
    app.kubernetes.io/part-of: monoplayer
spec:
  # One agent, one registration. A second pod would claim the same agent on
  # playit's control plane and the two would keep evicting each other.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: playit-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: playit-agent
        app.kubernetes.io/part-of: monoplayer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      # The namespace enforces pod-security.kubernetes.io/enforce: restricted.
      # The image ships no USER, so the pod supplies the identity: uid 1000,
      # the same one the proxy runs as. /playit/entrypoint.sh is a busybox sh
      # script and playitd is a static binary, so neither needs root, and the
      # one root-only step in the daemon (chowning the IPC socket to group
      # `playit`) is skipped at a non-zero uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: playit-agent
          image: ghcr.io/playit-cloud/playit-agent@sha256:5b7748d3e8564f1cac3d3a295a23640136fbf774c76a9509bd262d16b324b06b
          imagePullPolicy: IfNotPresent
          env:
            # HOME is /tmp for the same reason the proxy sets it: a tool that
            # writes under $HOME must not land on the read-only root.
            - name: HOME
              value: /tmp
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: playit-agent
                  key: SECRET_KEY
            # The image creates /var/lib/playit/certs at mode 0700 owned by
            # root, and this container's root is read-only. Certificates are
            # reissued per agent, so a restart is allowed to cost them.
            - name: CERT_DIR
              value: /tmp/playit/certs
          args:
            # playitd's socket defaults to /run/playit/playitd.sock; it creates
            # the parent directory, ignores the failure, then fails to bind.
            # Nothing in this pod speaks its IPC protocol, so the socket only
            # has to exist somewhere writable.
            - --socket-path=/tmp/playit/playitd.sock
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
