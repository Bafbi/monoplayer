# The player-facing front on the tailnet.
#
# The Tailscale operator turns this LoadBalancer into a proxy device named
# `glowsquidye`, so the client joins:
#   glowsquidye.tail41e568.ts.net:25565
#
# No public port and no Ingress on this object: the tailnet is the only route
# to the front from here. The lane's one public route is not this Service, it is
# the playit.gg tunnel in playit-agent.yaml (#202), which dials this Service by
# its in-namespace DNS name. The bucket is still online-mode; hasJoined runs
# against Mojang, and the attach whitelist decides who may stay.

apiVersion: v1
kind: Service
metadata:
  name: monoplayer
  namespace: monoplayer
  labels:
    app.kubernetes.io/name: monoplayer
    app.kubernetes.io/part-of: monoplayer
  annotations:
    tailscale.com/hostname: glowsquidye
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: monoplayer
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
