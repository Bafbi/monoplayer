# The deps surface below is experimental and arrives with mise 2026.10.11, the
# version this repository is developed against. An older mise refuses to start
# with this message instead of failing on a dependency it never installed.
min_version = "2026.10.11"

[tools]
node = "26.7.0"
pnpm = "11.25.0"
java = "25.0.2"
gradle = "9.8.2"
"github:moby/buildkit" = "0.33.1"

# deps is an experimental mise feature: with it off, `mise deps install` exits
# 1 with "deps is experimental. Enable it with `mise settings experimental=true`".
# This repository's [tasks.install] is that command, so the switch is committed
# here: a machine with no config of its own, CI included, still has it. The
# station that measured #639 had it on globally, which is how the dependency on
# it went unseen. An environment that sets MISE_EXPERIMENTAL=false still wins.
# CI installs the latest mise, which is at or above the floor above.
[settings]
experimental = true

# The dependencies are a declared provider, not a command the task re-spells.
# mise's own detection finds nothing here: with no [deps.pnpm] table,
# `mise deps install` in a fresh worktree answers "All dependencies are up to
# date" in 14 ms and leaves node_modules absent (#639, measured 2026-11-26 in a
# worktree with no node_modules). Declared, it installs, and an unchanged
# lockfile makes the next call a no-op.
#
# auto = true: any mise run in a cold checkout installs the workspace first, so
# the first command in a new worktree works whatever it is. That includes a task
# that only reads a cluster: measured the same day, `mise run dev:status` in a
# cold worktree paid the install before its own work, and the next run paid
# nothing (3.0 s, then 0.5 s; node_modules went from absent to 10 entries).
# auto = false instead needs every rung to depend on install and every human to
# remember it, and one mechanism that always works beats two that need
# explaining. A run that must not touch the store passes --no-deps.
[deps.pnpm]
auto = true
# mise's pnpm defaults hash pnpm-lock.yaml and package.json, and not the
# workspace file, which carries the build-script policy: change allowBuilds there
# and the install is stale while mise still calls it fresh. Named here, so the
# hash covers the third input too.
sources = ["pnpm-lock.yaml", "package.json", "pnpm-workspace.yaml"]
run = "pnpm install --frozen-lockfile --prefer-offline"

[tasks.install]
description = "Install the workspace dependencies."
run = "mise deps install"

# Every rung below is a shell script, not an inline command, because mise hands a
# task its arguments differently in each form. An inline command gets them
# appended to the end of the whole string. On a rung, that is the next-rung hint,
# so the rung never sees them. A shebang script gets them as script arguments
# ($1, $@). The script forwards them to the command it runs (#320). mise
# 2026.10.11 documents both forms under "Pass arguments":
# https://mise.jdx.dev/tasks/running-tasks.html#pass-arguments

[tasks.lint]
description = "Syntax-check every source, test, tool, and shell script, resolve every identifier they read, and prove the panel's committed stylesheet is what its source compiles to."
# The stylesheet check compiles Tailwind, which is a dev dependency, so lint needs
# the install like the test rung does. Without it a fresh checkout would fail the
# gate on a missing compiler instead of on a stale bundle.
# The resolve stage is ESLint with one rule, `no-undef` (eslint.config.js, #540). It
# is a dev dependency for the same reason as the compiler: the gate runs it and the
# image never does.
# It is handed the files git owns, because `pnpm exec eslint` with no file list
# parses every `.js` and `.mjs` under the working directory, gitignored or not. A
# throwaway script under `.scratch/` is the placement AGENTS.md asks for, and one
# of those failed the gate for every worktree of the clone (#846).
depends = ["install"]
run = '''
#!/usr/bin/env bash
# No stage of this chain reads an argument, so there is nothing to forward. It
# refuses one instead of dropping it. A run that ignored what it was given would
# report a check it did not make (#320).
[ "$#" -eq 0 ] || { echo "lint takes no arguments: it checks the files this repo owns" >&2; exit 2; }
(find src test tools \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check && bash -n tools/nath.sh tools/driver/install.sh scripts/link-secrets.sh scripts/online-cluster.sh scripts/build-protocollib.sh scripts/dev-lane.sh scripts/dev-custody.sh scripts/gate-lane.sh scripts/observer-report.sh && node tools/panel-css.mjs --check && git ls-files -z --cached --others --exclude-standard -- '*.js' '*.mjs' | xargs -0 -r pnpm exec eslint --no-warn-ignored --no-error-on-unmatched-pattern) || node src/ladder/next-rung.js lint $?
'''


[tasks."secrets:link"]
description = "Link the main working copy's .secrets into this worktree (symlink, never a copy)."
run = "scripts/link-secrets.sh"

[tasks.test]
description = "Run the unit/fake tests (loopback sockets only, no auth)."
depends = ["install"]
run = '''
#!/usr/bin/env bash
node --test 'test/{core,legs,service,custody,observability,ladder,driver,tooling,testbed,support,panel}/*.test.js' "$@" || node src/ladder/next-rung.js test $?
'''

[tasks.spike]
description = "Run the frozen protocol spike test (real sockets, offline protocol)."
depends = ["install"]
wait_for = ["check"]
run = "node --test test/spike/*.test.js"

[tasks.loopback]
description = "Run the product offline loopback rung (real legs, fake backend, protocol bot; no auth)."
depends = ["install"]
run = '''
#!/usr/bin/env bash
node src/ladder/loopback.js "$@" || node src/ladder/next-rung.js loopback $?
'''

[tasks."parity:run"]
description = "Run the client parity report: two protocol bots join a server, one directly and one through the proxy, compared (#13)."
depends = ["install"]
wait_for = ["check"]
run = '''
#!/usr/bin/env bash
node src/ladder/client-parity.js "$@" || node src/ladder/next-rung.js parity:run $?
'''

[tasks.online]
description = "Attach a real Microsoft Bafbi bot through the online front (needs the GlowSquidye puppet, a backend this repo deploys named in MONOPLAYER_BACKEND_HOST, and the account lease, which needs kubectl)."
depends = ["install"]
wait_for = ["check"]
# The account is one refresh chain, so the bare rung takes the lease too (#280). Both
# forms of the rung then exclude each other, and neither waits for a human.
run = '''
#!/usr/bin/env bash
scripts/online-cluster.sh hold node src/ladder/online.js "$@" || node src/ladder/next-rung.js online $?
'''

[tasks."online:cluster"]
description = "Run the online rung from a throwaway pod against the gate backend, leaving the deployment serving. It holds the account lease, so a second run waits or is refused (#280). It refuses an expired cached token for either account, because a login there would rotate that account's chain away from the copy that stays live. Pass --rotate to accept the rotation and copy it back (#389)."
run = "scripts/online-cluster.sh"

[tasks."panel:css"]
description = "Compile the panel's Tailwind source into the committed src/panel/public/app.css. Pass -- --check to recompile and fail when the committed bundle is stale, which is what the lint rung runs."
run = "node tools/panel-css.mjs"

[tasks."panel:run"]
description = "Serve the panel on this machine from the registry this repo ships, on port 8080. Needs no cluster: the page reads the ConfigMap in deploy/panel."
run = "node src/panel/start.js --registry deploy/panel/registry.yaml --host 127.0.0.1"

[tasks."panel:fixture"]
description = "Serve the panel on this machine from the recorded document at test/panel/fixtures/panel.json instead of a cluster, so a page can be reviewed before it is merged. For another document, run node src/panel/start.js --fixture <file> directly."
run = "node src/panel/start.js --fixture test/panel/fixtures/panel.json --host 127.0.0.1"

# The gate. mise sends SIGTERM to every still-running sibling when one task fails,
# and a killed rung prints the reason it was killed as if it were its own failure
# (#215, "A failed rung names the next one" in docs/testing-ladder.md). So the gate
# owns no dependency edge. It runs the list below through a task that mise runs
# with --continue-on-error, which lets every rung finish and then names each one
# that failed.
[tasks.check]
description = "Default gate: lint, unit tests, offline loopback. Every rung finishes even when one fails, and a red gate names the rungs that failed (#215)."
run = '''
#!/usr/bin/env bash
# No stage of this chain reads an argument, so it refuses one instead of dropping
# it (#320).
[ "$#" -eq 0 ] || { echo "check takes no arguments: it runs the gate" >&2; exit 2; }
# --skip-tools: no rung here uses java, gradle or buildkit, and the tools this
# gate does need are installed by the invocation that reached this script.
exec mise run --continue-on-error --skip-tools check:rungs
'''

# The rungs, as siblings. A direct run lets one failure cancel the others, so the
# gate is the way in. mise has no flag that refuses a task, so this one says it in
# its description instead.
[tasks."check:rungs"]
description = "The gate's three cheap rungs, as the siblings check runs. Run mise run check, not this: a dependency edge is what mise cancels when a rung fails (#215)."
depends = ["lint", "test", "loopback"]

# The check that covers each area, on top of the gate. Each one composes the
# rung tasks through depends, so a rung command is defined once.
#
# mise runs sibling depends concurrently, so an expensive rung waits for the
# gate through its own wait_for: a red gate stops it before it starts. wait_for
# schedules nothing, so a bare `mise run online` is unchanged.

[tasks."verify:relay"]
description = "Verify a relay change: the gate, the frozen protocol spike, then the client parity report."
depends = ["check", "spike", "parity:run"]

[tasks."verify:custody"]
description = "Verify a custody change: the gate, then the online bot rung (needs a repo-deployed backend and both custodians)."
depends = ["check", "online"]

[tasks."verify:driver"]
description = "Verify a driver change: the gate, the Fabric driver build, then the real-client scenario (needs the SSH tunnel and the gate Paper)."
depends = ["check", "driver:build", "driver:scenario"]

[tasks."verify:deploy"]
description = "Verify a deploy change: the gate, then the image build (needs cluster access; it publishes nothing)."
depends = ["check", "image:build:no-push"]

[tasks."spike:report"]
description = "Run the standalone spike scenario and write a report."
depends = ["install"]
run = "node src/spike/run.js"

[tasks."driver:build"]
description = "Build the Fabric client driver."
run = "gradle -p tools/driver --no-daemon build"

[tasks."driver:scenario"]
description = "Run the driver-lane G0 scenario (2 consecutive runs; needs the driver SSH tunnel and the gate Paper)."
depends = ["install"]
wait_for = ["check", "driver:build"]
run = '''
#!/usr/bin/env bash
node src/driver/run.js --runs 2 "$@" || node src/ladder/next-rung.js driver:scenario $?
'''

[tasks."driver:g0"]
description = "Driver-lane G0 verdict: run the two-run scenario, then verify both fresh reports plus an unmodded witness whose every step is recorded."
depends = ["check", "driver:build", "driver:scenario"]
run = '''
#!/usr/bin/env bash
node src/driver/run.js --verify-g0 "$@" || node src/ladder/next-rung.js driver:g0 $?
'''

[tasks."driver:parity"]
description = "Client parity on the real client: join a backend directly, then through the proxy, and compare the client state (#62). Needs the driver tunnel and both endpoints."
depends = ["install"]
wait_for = ["check", "driver:build"]
run = '''
#!/usr/bin/env bash
node src/driver/run.js --lane parity --tunnel "$@" || node src/ladder/next-rung.js driver:parity $?
'''

[tasks."image:build"]
description = "Build and push the Monoplayer image to the cluster Zot registry."
wait_for = ["check"]
run = "scripts/build-image.sh"

[tasks."image:build:no-push"]
description = "Build the Monoplayer image and print its digest, publishing nothing (#33)."
wait_for = ["check"]
run = "PUSH=0 scripts/build-image.sh"

[tasks."image:retention"]
description = "List the image tags retention would delete, and delete nothing (#118). Fetches the deploy pin first, because a stale origin/deploy would call the live digest a deletion candidate. Needs a token with read:packages in GH_TOKEN."
run = """
#!/usr/bin/env bash
set -euo pipefail
pin=$(mktemp)
trap 'rm -f "$pin"' EXIT
# The pin is the running image. An unfetched origin/deploy names the previous one,
# so the plan a human reviews would be wrong about the one pin that matters most.
git fetch --quiet --no-tags origin deploy
git show origin/deploy:deploy/manifests/kustomization.yaml > "$pin"
node tools/image-retention.mjs plan --deploy "$pin"
"""

[tasks."observer:build"]
description = "Build the server transparency observer plugin (needs the pinned ProtocolLib)."
depends = ["observer:protocollib"]
run = "gradle -p tools/observer --no-daemon build"

[tasks."observer:protocollib"]
description = "Build the pinned ProtocolLib jar the observer plugin links against (no release supports 26.x)."
run = "scripts/build-protocollib.sh"

[tasks."dev:up"]
description = "Bring up the dev validation lane: its own Paper, Monoplayer, and custody volume (#42). The account is #44."
run = "scripts/dev-lane.sh up"

[tasks."dev:image"]
description = "Run a branch image on the dev lane: mise run dev:image <sha-tag> (#43)."
run = "scripts/dev-lane.sh set-image"

[tasks."dev:join"]
description = "Report the dev proxy's own account on the dev Paper, or that nothing has claimed yet (#43 AC3, #676)."
run = "scripts/dev-lane.sh join"

[tasks."dev:custody:up"]
description = "Create the dev custody handle pod: the operator's shell on the dev custody volume (#44)."
run = "scripts/dev-custody.sh up"

[tasks."dev:custody:down"]
description = "Delete the dev custody handle pod. The dev proxy needs the volume, so remove this pod before mise run dev:up."
run = "scripts/dev-custody.sh down"

[tasks."dev:custody"]
description = "Bootstrap the dev puppet account onto the dev custody volume (#44): one device-code approval, headless after that."
run = "scripts/dev-custody.sh bootstrap"

[tasks."dev:custody:status"]
description = "Report the dev account's custody health from the dev custody volume."
run = "scripts/dev-custody.sh status"

[tasks."dev:prove-live"]
description = "Run a command and prove the live account's token files are byte-identical afterwards (#44 AC4): mise run dev:prove-live -- <command>."
run = "scripts/dev-custody.sh prove-live"

[tasks."dev:down"]
description = "Stop the dev validation lane, keeping the dev account: mise run dev:down -- --purge removes the account too."
run = "scripts/dev-lane.sh down"

[tasks."dev:status"]
description = "Report what the dev lane runs and how many replicas the live lane serves."
run = "scripts/dev-lane.sh status"

[tasks."gate:up"]
description = "Bring the gate lane up: apply deploy/driver, wake the rows a rung drives, and wait up to 900 s (a cold start is 90 s). Name deployments after -- to wake the M4 rows too: mise run gate:up -- velocity paper-m4 toxiproxy."
run = "scripts/gate-lane.sh up"

[tasks."gate:down"]
description = "Stop the gate lane: scale every gate workload to 0, then wait for its pods to go. The objects and the hand-created Secrets stay; every world is emptyDir, so the next gate:up is a full cold start."
run = "scripts/gate-lane.sh down"

[tasks."gate:status"]
description = "Report what the gate lane runs and what is ready, so a reader can see whether the lane was left up."
run = "scripts/gate-lane.sh status"

[tasks.lanes]
description = "List every gate lane on the cluster with its age and the worktree that owns it. Add -- --reap to delete the lanes idle past the window (MONOPLAYER_GATE_IDLE_WINDOW, six hours by default), and -- --window SECONDS to set that window for one run."
run = "scripts/gate-lane.sh lanes"

[tasks."observer:run"]
description = "Run the server-view report: the direct baseline join and the puppet join on paper-conduct, the gate-serving Paper, compared (#12)."
depends = ["install", "observer:build"]
run = "scripts/observer-report.sh"

[tasks."testbed:up"]
description = "Take the live proxy offline, start the two-Paper transfer testbed, and compare registries."
depends = ["install"]
run = "node src/testbed/switch.js up"

[tasks."testbed:client"]
description = "Attach Bafbi's headless client to the testbed front."
depends = ["install"]
run = "node src/testbed/client.js"

[tasks."testbed:transfer"]
description = "RCON-transfer the puppet from paper-hub to paper-sky and verify it."
depends = ["install"]
run = "node src/testbed/switch.js transfer"

[tasks."testbed:registry"]
description = "Compare the hub and target dimension_type registries."
depends = ["install"]
run = "node src/testbed/switch.js registry"

[tasks."testbed:down"]
description = "Stop the testbed, restore the live deployment, then delete its front Service. It also puts Argo auto-sync back from the run's restore record, while that record survives."
depends = ["install"]
run = "node src/testbed/switch.js down"

[tasks."testbed:run"]
description = "Full puppet transfer: up, transfer, down. Its down step restores the live deployment. An interrupt skips it, so the live front stays offline until an operator runs mise run testbed:down."
depends = ["install"]
run = '''
#!/usr/bin/env bash
node src/testbed/switch.js run "$@" || node src/ladder/next-rung.js testbed:run $?
'''
