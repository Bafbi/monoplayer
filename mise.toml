[tools]
node = "26.7.0"
pnpm = "11.25.0"
java = "25.0.2"
gradle = "9.8.2"
"github:moby/buildkit" = "0.33.1"

[tasks.install]
description = "Install the workspace dependencies."
run = "pnpm install --frozen-lockfile"

[tasks.lint]
description = "Syntax-check every source, test, tool, and shell script."
run = "(find src test tools \\( -name '*.js' -o -name '*.mjs' \\) -print0 | xargs -0 -n1 node --check && bash -n tools/nath.sh tools/driver/install.sh) || node src/ladder/next-rung.js lint $?"

[tasks.test]
description = "Run the pure unit/fake tests (no sockets, no auth)."
depends = ["install"]
run = "node --test 'test/{core,legs,service,custody,observability,ladder,driver,tooling}/*.test.js' || node src/ladder/next-rung.js test $?"

[tasks.spike]
description = "Run the frozen protocol spike test (real sockets, offline protocol)."
depends = ["install"]
wait_for = ["check"]
run = "node --test test/spike/*.test.js"

[tasks.loopback]
description = "Run the product offline loopback rung (real legs, fake backend, protocol bot; no auth)."
depends = ["install"]
run = "node src/ladder/loopback.js || node src/ladder/next-rung.js loopback $?"

[tasks.online]
description = "Attach a real Microsoft Bafbi bot through the online front (needs the GlowSquidye puppet and the live backend)."
depends = ["install"]
wait_for = ["check"]
run = "node src/ladder/online.js || node src/ladder/next-rung.js online $?"

[tasks.check]
description = "Default gate: lint, unit tests, offline loopback."
depends = ["lint", "test", "loopback"]

# The check that covers each area, on top of the gate. Each one composes the
# rung tasks through depends, so a rung command is defined once.
#
# mise runs sibling depends concurrently, so an expensive rung waits for the
# gate through its own wait_for: a red gate stops it before it starts. wait_for
# schedules nothing, so a bare `mise run online` is unchanged.

[tasks."verify:relay"]
description = "Verify a relay change: the gate, then the frozen protocol spike."
depends = ["check", "spike"]

[tasks."verify:custody"]
description = "Verify a custody change: the gate, then the online bot rung (needs the live backend and both custodians)."
depends = ["check", "online"]

[tasks."verify:driver"]
description = "Verify a driver change: the gate, the Fabric driver build, then the real-client scenario (needs the SSH tunnel and the live backend)."
depends = ["check", "driver:build", "driver:scenario"]

[tasks."verify:deploy"]
description = "Verify a deploy change: the gate, then the image build (needs cluster access; it publishes to the Zot registry)."
depends = ["check", "image:build"]

[tasks."spike:report"]
description = "Run the standalone spike scenario and write a report."
depends = ["install"]
run = "node src/spike/run.js"

[tasks."driver:build"]
description = "Build the Fabric client driver."
run = "gradle -p tools/driver --no-daemon build"

[tasks."driver:scenario"]
description = "Run the driver-lane G0 scenario (2 consecutive runs; needs the driver SSH tunnel and the live backend)."
depends = ["install"]
wait_for = ["check", "driver:build"]
run = "node src/driver/run.js --runs 2 || node src/ladder/next-rung.js driver:scenario $?"

[tasks."driver:g0"]
description = "Driver-lane G0 verdict: run the two-run scenario, then verify both fresh reports plus the completed unmodded witness."
depends = ["check", "driver:build", "driver:scenario"]
run = "node src/driver/run.js --verify-g0 || node src/ladder/next-rung.js driver:g0 $?"

[tasks."driver:install"]
description = "Install the built driver into the display host's Prism root (run on the host)."
run = "tools/driver/install.sh tools/driver/build/libs/monoplayer-driver-0.1.0.jar"

[tasks."image:build"]
description = "Build and push the Monoplayer image to the cluster Zot registry."
wait_for = ["check"]
run = "scripts/build-image.sh"

[tasks."testbed:up"]
description = "Take the live proxy offline, start the two-Paper transfer testbed, and compare registries."
depends = ["install"]
run = "node src/testbed/switch.js up"

[tasks."testbed:client"]
description = "Attach Bafbi's headless client to the testbed front."
depends = ["install"]
run = "node src/testbed/client.js"

[tasks."testbed:transfer"]
description = "RCON-transfer the puppet from paper-hub to paper-sky and verify it."
depends = ["install"]
run = "node src/testbed/switch.js transfer"

[tasks."testbed:registry"]
description = "Compare the hub and target dimension_type registries."
depends = ["install"]
run = "node src/testbed/switch.js registry"

[tasks."testbed:down"]
description = "Stop the testbed and restore the live Excalia proxy."
depends = ["install"]
run = "node src/testbed/switch.js down"

[tasks."testbed:run"]
description = "Full puppet transfer: up, transfer, down, always restoring the live proxy."
depends = ["install"]
run = "node src/testbed/switch.js run || node src/ladder/next-rung.js testbed:run $?"
